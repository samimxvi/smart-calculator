[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-calculator-agent"
version = "0.1.0"
description = "A local, tool-calling calculator agent built with LangChain and Ollama"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-ollama>=0.3",
    "langgraph",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.40"]

[project.scripts]
calc-agent = "calc_agent.cli:main"
calc-ui = "calc_agent.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]